name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, test and build
        run: ./gradlew --continue lintDebug testDebugUnitTest assembleDebug
      - name: Print lint findings
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: lull-debug-apk
          path: app/build/outputs/apk/debug/*.apk
